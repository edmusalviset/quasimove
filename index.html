<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>QUASIMOVE</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #0a0a0b;
    --surface: #141416;
    --surface2:#1c1c1f;
    --border:  #2a2a30;
    --text:    #f0f0f0;
    --dim:     #666;
    --accent:  #e8ff3a;
    --accent2: #3adfff;
    --accent3: #c084fc;
    --orange:  #ff9500;
    --red:     #ff4b6e;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    overflow: hidden;
    touch-action: none;
  }
  button {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    border-radius: 6px;
    cursor: pointer;
    padding: 10px 16px;
    transition: all 0.15s;
  }
  button:hover { border-color: var(--accent); }
  button.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: bold; }

  /* ---- LAYOUT ---- */
  #app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---- HEADER ---- */
  header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 3px;
    color: var(--accent);
  }
  .tagline {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 1px;
  }

  /* ---- SOUND GRID ---- */
  #sound-grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    padding: 20px;
    align-content: start;
  }
  .sound-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 20px 14px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .sound-card:active { transform: scale(0.97); }
  .sound-card.selected {
    border-color: var(--card-color, var(--accent));
    background: rgba(255,255,255,0.04);
    box-shadow: 0 0 18px -4px var(--card-color, var(--accent));
  }
  .sound-card svg { width: 56px; height: 28px; color: var(--card-color, var(--accent)); }
  .sound-card .name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 1px;
    text-align: center;
    color: var(--text);
  }
  .sound-card .desc {
    font-size: 9px;
    color: var(--dim);
    text-align: center;
    letter-spacing: 0.5px;
  }

  /* ---- PLAY BAR ---- */
  #play-bar {
    flex-shrink: 0;
    padding: 16px 20px 20px;
    border-top: 1px solid var(--border);
    display: none;
    flex-direction: column;
    gap: 12px;
    background: var(--surface);
  }
  #play-bar.visible { display: flex; }
  #play-bar .selected-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 1.5px;
    color: var(--accent);
    text-align: center;
  }
  #btn-play {
    width: 100%;
    padding: 18px;
    font-size: 15px;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 2px;
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: bold;
  }
  #btn-play.playing {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }

  /* ---- PERFORMANCE OVERLAY ---- */
  #perf-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,10,11,0.97);
    z-index: 9999;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 40px 24px 48px;
  }
  #perf-overlay.visible { display: flex; }
  .perf-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 4px;
    color: var(--accent);
  }
  .perf-sound {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 1px;
    margin-top: -20px;
  }

  /* Visualiseur de position */
  #perf-viz {
    width: min(320px, 90vw);
    aspect-ratio: 1;
    position: relative;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: radial-gradient(circle, var(--surface2) 0%, var(--bg) 100%);
  }
  .viz-axis {
    position: absolute;
    background: var(--border);
    pointer-events: none;
  }
  .viz-axis.h { left: 0; right: 0; top: 50%; height: 1px; transform: translateY(-50%); }
  .viz-axis.v { top: 0; bottom: 0; left: 50%; width: 1px; transform: translateX(-50%); }
  .viz-label {
    position: absolute;
    font-size: 9px;
    color: var(--dim);
    letter-spacing: 1px;
    font-family: 'Space Mono', monospace;
  }
  .viz-label.top    { top: 12px;    left: 50%; transform: translateX(-50%); }
  .viz-label.bottom { bottom: 12px; left: 50%; transform: translateX(-50%); }
  .viz-label.left   { left: 14px;   top: 50%;  transform: translateY(-50%); }
  .viz-label.right  { right: 14px;  top: 50%;  transform: translateY(-50%); }
  #viz-dot {
    position: absolute;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    transform: translate(-50%, -50%);
    transition: left 0.08s, top 0.08s;
    box-shadow: 0 0 14px 4px var(--accent);
    top: 50%; left: 50%;
  }

  .perf-readouts {
    width: 100%;
    display: flex;
    gap: 12px;
  }
  .perf-readout {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .perf-readout label {
    font-size: 9px;
    color: var(--dim);
    letter-spacing: 1px;
  }
  .perf-readout span {
    font-size: 13px;
    color: var(--accent3);
    text-align: center;
    min-height: 18px;
  }

  #btn-stop-perf {
    width: 100%;
    padding: 18px;
    font-size: 15px;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 2px;
    background: var(--red);
    border-color: var(--red);
    color: #fff;
    font-weight: bold;
  }

  footer {
    flex-shrink: 0;
    text-align: center;
    padding: 6px;
    font-size: 9px;
    color: var(--dim);
    letter-spacing: 0.5px;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">QUASIMOVE</div>
    <div class="tagline">INSTRUMENT GESTUEL</div>
  </header>

  <div id="sound-grid"></div>

  <div id="play-bar">
    <div class="selected-name" id="selected-name">—</div>
    <button id="btn-play">▶ JOUER</button>
  </div>

  <footer>© 2025 jm voiront — QUASIMOVE — CC BY-NC-ND 4.0</footer>
</div>

<!-- OVERLAY PERFORMANCE -->
<div id="perf-overlay">
  <div class="perf-logo">QUASIMOVE</div>
  <div class="perf-sound" id="perf-sound-name">—</div>

  <div id="perf-viz">
    <div class="viz-axis h"></div>
    <div class="viz-axis v"></div>
    <div class="viz-label top">AIGU</div>
    <div class="viz-label bottom">GRAVE</div>
    <div class="viz-label left">PB</div>
    <div class="viz-label right">PH</div>
    <div id="viz-dot"></div>
  </div>

  <div class="perf-readouts">
    <div class="perf-readout">
      <label>HAUTEUR</label>
      <span id="perf-pitch">—</span>
    </div>
    <div class="perf-readout">
      <label>FILTRE</label>
      <span id="perf-filter">—</span>
    </div>
  </div>

  <button id="btn-stop-perf">■ ARRÊTER</button>
</div>

function base64ToArrayBuffer(b64) {
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}

    for (let i = 0; i < len; i++) {
      const t = i / sr;
      ch[i] = Math.sin(2*Math.PI*f1*t) * Math.sin(2*Math.PI*f2*t) * 0.9;
    }
  } else if (type === 'theremin') {
    const fc = 220, vibRate = 6, vibCents = 25, driftRate = 0.5, driftCents = 50;
    let phase = 0;
    for (let i = 0; i < len; i++) {
      const t = i / sr;
      const cents = vibCents*Math.sin(2*Math.PI*vibRate*t) + driftCents*Math.sin(2*Math.PI*driftRate*t);
      phase += 2*Math.PI * fc*Math.pow(2, cents/1200) / sr;
      ch[i] = Math.sin(phase) * 0.85;
    }
  } else if (type === 'drone') {
    const freqs = [220, 221.5, 218.75];
    for (let i = 0; i < len; i++) {
      const t = i / sr;
      let v = 0;
      freqs.forEach(f => v += Math.sin(2*Math.PI*f*t));
      ch[i] = v / freqs.length * (0.8 + 0.2*Math.sin(2*Math.PI*0.5*t)) * 0.9;
    }
  } else if (type === 'wind') {
    let smoothed = 0;
    for (let i = 0; i < len; i++) {
      const alpha = 0.05 + 0.07*(0.5 + 0.5*Math.sin(2*Math.PI*0.25*i/sr));
      smoothed += ((Math.random()*2-1) - smoothed) * alpha;
      ch[i] = smoothed * 2.6;
    }
  } else if (type === 'blips') {
    const nBlips = 5 + Math.floor(Math.random()*4);
    for (let b = 0; b < nBlips; b++) {
      const bd = 0.06 + Math.random()*0.1;
      const st = 0.15 + Math.random()*(dur - bd - 0.3);
      const freq = 350 + Math.random()*900;
      const si = Math.round(st*sr), bl = Math.round(bd*sr);
      for (let i = 0; i < bl; i++) {
        ch[si+i] += Math.sin(2*Math.PI*freq*i/sr) * Math.exp(-i/sr*18) * 0.8;
      }
    }
  } else if (type === 'granular') {
    if (impulseSourceBuffer) {
      const src = impulseSourceBuffer.getChannelData(0);
      const srcLen = src.length, srcSr = impulseSourceBuffer.sampleRate;
      for (let g = 0; g < 240; g++) {
        const gd = 0.015 + Math.random()*0.05;
        const gl = Math.round(gd*sr);
        const st = Math.random()*(dur - gd);
        const si = Math.round(st*sr);
        const rate = (srcSr/sr)*(0.5 + Math.random()*1.5);
        const amp = 0.5 + Math.random()*0.6;
        const maxSrc = Math.max(1, srcLen - gl*rate - 1);
        const ss = Math.random()*maxSrc;
        for (let i = 0; i < gl; i++) {
          const env = Math.sin(Math.PI*i/gl);
          const sp = ss + i*rate;
          const i0 = Math.floor(sp);
          const frac = sp - i0;
          let v = 0;
          if (i0 >= 0 && i0+1 < srcLen) v = src[i0]*(1-frac) + src[i0+1]*frac;
          if (si+i < len) ch[si+i] += v*env*amp;
        }
      }
    } else {
      for (let g = 0; g < 240; g++) {
        const gd = 0.015 + Math.random()*0.05;
        const gl = Math.round(gd*sr);
        const st = Math.random()*(dur - gd);
        const si = Math.round(st*sr);
        const freq = 120 + Math.random()*600;
        const amp = 0.12 + Math.random()*0.16;
        const noisy = Math.random() < 0.3;
        for (let i = 0; i < gl; i++) {
          const env = Math.sin(Math.PI*i/gl);
          const v = noisy ? Math.random()*2-1 : Math.sin(2*Math.PI*freq*i/sr);
          if (si+i < len) ch[si+i] += v*env*amp;
        }
      }
    }
  }

  // Clamp
  for (let i = 0; i < len; i++) {
    if (ch[i] > 1) ch[i] = 1;
    else if (ch[i] < -1) ch[i] = -1;
  }
  const buf = audioCtx.createBuffer(1, len, sr);
  buf.copyToChannel(ch, 0);
  return buf;
}

function makeDriveCurve(amount) {
  const n = 1024, curve = new Float32Array(n);
  const k = Math.max(0.0001, amount), norm = Math.tanh(k);
  for (let i = 0; i < n; i++) curve[i] = Math.tanh(k * ((i/(n-1))*2-1)) / norm;
  return curve;
}

// ---- Filtre selon inclinaison latérale ----
function filterForGamma(dGamma) {
  const g = Math.max(-45, Math.min(45, dGamma));
  let type, t;
  if (g < -15)     { type = 'lowpass';  t = (g+45)/30; }
  else if (g > 15) { type = 'highpass'; t = (g-15)/30; }
  else             { type = 'bandpass'; t = (g+15)/30; }
  t = Math.max(0, Math.min(1, t));
  return { type, freq: 30 * Math.pow(6000/30, t) };
}

function pitchForBeta(dBeta) {
  const norm = Math.max(-1, Math.min(1, dBeta/45));
  return Math.pow(2, norm * PITCH_RANGE/2);
}

// ---- Démarrage audio ----
function startPerfAudio(type) {
  const buf = generateBuffer(type);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.loop = true;
  const shaper = audioCtx.createWaveShaper();
  shaper.curve = makeDriveCurve(2);
  const f1 = audioCtx.createBiquadFilter();
  const f2 = audioCtx.createBiquadFilter();
  f1.type = f2.type = 'lowpass';
  f1.Q.value = f2.Q.value = 4;
  f1.frequency.value = f2.frequency.value = 4000;
  const gain = audioCtx.createGain();
  gain.gain.value = 0.8;
  src.connect(shaper); shaper.connect(f1); f1.connect(f2); f2.connect(gain); gain.connect(audioCtx.destination);
  src.start();
  perfState.src = src; perfState.filt1 = f1; perfState.filt2 = f2; perfState.shaper = shaper;
}

function stopPerfAudio() {
  if (perfState.src) { try { perfState.src.stop(); } catch(e) {} }
  perfState.src = null; perfState.filt1 = null; perfState.filt2 = null; perfState.shaper = null;
}

// ---- Gestionnaire orientation ----
function onOrientation(e) {
  if (e.beta === null || e.gamma === null) return;
  if (!perfState.calibrated) {
    perfState.betaCenter = e.beta;
    perfState.gammaCenter = e.gamma;
    perfState.calibrated = true;
  }
  const dBeta  = e.beta  - perfState.betaCenter;
  const dGamma = e.gamma - perfState.gammaCenter;

  const pitch = pitchForBeta(dBeta);
  if (perfState.src) perfState.src.playbackRate.value = pitch;

  const { type, freq } = filterForGamma(dGamma);
  if (perfState.filt1) {
    perfState.filt1.type = type; perfState.filt2.type = type;
    perfState.filt1.frequency.value = freq; perfState.filt2.frequency.value = freq;
  }

  // Mise à jour UI
  const semitones = Math.round(12 * Math.log2(pitch) * 10) / 10;
  document.getElementById('perf-pitch').textContent = (semitones >= 0 ? '+' : '') + semitones + ' st';
  document.getElementById('perf-filter').textContent = ({lowpass:'PASSE-BAS', highpass:'PASSE-HAUT', bandpass:'PASSE-BANDE'})[type] + '\n' + Math.round(freq) + ' Hz';

  // Visualiseur dot : gamma → x, beta → y (inversé)
  const viz = document.getElementById('perf-viz');
  const r = viz.offsetWidth / 2;
  const nx = Math.max(0, Math.min(1, (dGamma + 45) / 90));
  const ny = Math.max(0, Math.min(1, (dBeta + 45) / 90));
  const dot = document.getElementById('viz-dot');
  dot.style.left = (nx * 100) + '%';
  dot.style.top  = ((1-ny) * 100) + '%';
  const def = SOUND_TYPES.find(d => d.type === selectedType);
  if (def) dot.style.background = dot.style.boxShadow = '', dot.style.background = def.color, dot.style.boxShadow = `0 0 14px 4px ${def.color}`;
}

// ---- Démarrage mode perf ----
async function startPerf() {
  // ⚠️ iOS : requestPermission DOIT être le premier await
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    let result;
    try { result = await DeviceOrientationEvent.requestPermission(); } catch(e) { result = 'denied'; }
    if (result !== 'granted') {
      alert("Permission refusée.\nSur iPhone : Réglages → Safari → Capteurs de mouvement → Autoriser.");
      return;
    }
  }

  ensureAudioCtx();
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  perfState.calibrated = false;
  document.getElementById('perf-sound-name').textContent = SOUND_TYPES.find(d=>d.type===selectedType)?.label || '—';
  document.getElementById('perf-pitch').textContent = 'bouge le téléphone…';
  document.getElementById('perf-filter').textContent = '…';

  startPerfAudio(selectedType);

  // Essai deviceorientationabsolute (Android Chrome) puis deviceorientation (iOS)
  let fired = false;
  const probe = () => { fired = true; };
  window.addEventListener('deviceorientationabsolute', probe, { once: true });
  setTimeout(() => {
    window.removeEventListener('deviceorientationabsolute', probe);
    const evt = fired ? 'deviceorientationabsolute' : 'deviceorientation';
    perfState.handler = onOrientation;
    perfState.eventName = evt;
    window.addEventListener(evt, perfState.handler);
  }, 400);

  document.getElementById('perf-overlay').classList.add('visible');
  perfState.active = true;
}

function stopPerf() {
  if (perfState.handler) {
    window.removeEventListener(perfState.eventName || 'deviceorientation', perfState.handler);
    window.removeEventListener('deviceorientationabsolute', perfState.handler);
  }
  perfState.handler = null; perfState.eventName = null; perfState.active = false;
  stopPerfAudio();
  document.getElementById('perf-overlay').classList.remove('visible');
  document.getElementById('btn-play').classList.remove('playing');
  document.getElementById('btn-play').textContent = '▶ JOUER';
}

// ---- Construction de la grille ----
function buildGrid() {
  const grid = document.getElementById('sound-grid');
  SOUND_TYPES.forEach(def => {
    const card = document.createElement('div');
    card.className = 'sound-card';
    card.dataset.type = def.type;
    card.style.setProperty('--card-color', def.color);
    card.innerHTML = `
      <svg viewBox="0 0 40 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${def.icon}</svg>
      <div class="name">${def.label}</div>
      <div class="desc">${def.desc}</div>
    `;
    card.addEventListener('click', () => selectSound(def.type));
    grid.appendChild(card);
  });
}

function selectSound(type) {
  selectedType = type;
  document.querySelectorAll('.sound-card').forEach(el => {
    el.classList.toggle('selected', el.dataset.type === type);
  });
  const def = SOUND_TYPES.find(d => d.type === type);
  document.getElementById('selected-name').textContent = def.label;
  document.getElementById('play-bar').classList.add('visible');
  document.getElementById('btn-play').classList.remove('playing');
  document.getElementById('btn-play').textContent = '▶ JOUER';
}

// ---- Bouton play ----
document.getElementById('btn-play').addEventListener('click', () => {
  if (perfState.active) { stopPerf(); return; }
  startPerf();
});
document.getElementById('btn-stop-perf').addEventListener('click', stopPerf);

// ---- Chargement son source granulaire ----
function loadImpulse() {
  if (IMPULSE_MP3_B64 === '__IMPULSE_B64__') return;
  try {
    ensureAudioCtx();
    audioCtx.decodeAudioData(base64ToArrayBuffer(IMPULSE_MP3_B64),
      buf => { impulseSourceBuffer = buf; },
      err => console.warn('[Granulaire] décodage échoué', err)
    );
  } catch(e) { console.warn('[Impulse]', e); }
}

// ---- Init ----
buildGrid();
// Préchargement de l'impulse dès le premier geste
document.addEventListener('click', () => {
  if (!audioCtx) { ensureAudioCtx(); loadImpulse(); }
}, { once: true });
</script>
